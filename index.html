<!doctype html>
<html lang="es-MX">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#030303">
  <title>EVA · Evaluación de competencias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --negro: #030303;
      --azul: #13213C;
      --ambar: #FCA311;
      --blanco: #FDFDFD;
      --gris: #E5E5E5;
      --suave: rgba(229, 229, 229, .64);
      --tenue: rgba(229, 229, 229, .38);
      --linea: rgba(229, 229, 229, .12);
      --tarjeta: rgba(19, 33, 60, .42);
      --tarjeta-hover: rgba(19, 33, 60, .7);
      --ambar-velo: rgba(252, 163, 17, .12);
      --radio: 16px;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--blanco);
      background: var(--negro);
      background-image: radial-gradient(120% 60% at 50% -12%, rgba(19, 33, 60, .95) 0%, rgba(19, 33, 60, .25) 45%, transparent 70%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    .app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: 0 auto;
      padding: 0 20px
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 0 8px
    }

    header img {
      height: 20px;
      width: auto;
      display: block
    }

    .etiqueta {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--tenue)
    }

    .demo {
      color: var(--ambar);
      border: 1px solid rgba(252, 163, 17, .4);
      border-radius: 99px;
      padding: 2px 10px;
      font-size: 10px;
      letter-spacing: .12em
    }

    /* --- Avance: la figura que se pone de pie --- */
    .avance {
      padding: 6px 0 0;
      opacity: 0;
      transition: opacity .6s var(--ease)
    }

    .avance.visible {
      opacity: 1
    }

    .avance svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible
    }

    .avance-pie {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      color: var(--tenue);
      padding: 4px 0 0
    }

    .avance-pie b {
      color: var(--suave);
      font-weight: 500
    }

    .figura-actual {
      animation: respira 3.4s ease-in-out infinite
    }

    @keyframes respira {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-.8px)
      }
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px 0 32px;
      min-height: 62vh
    }

    .pantalla {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .42s var(--ease), transform .42s var(--ease)
    }

    .pantalla.entra {
      opacity: 1;
      transform: none
    }

    .pantalla.sale {
      opacity: 0;
      transform: translateY(-8px);
      transition-duration: .2s
    }

    h1 {
      font-size: 30px;
      line-height: 1.18;
      font-weight: 500;
      letter-spacing: -.01em
    }

    h2 {
      font-size: 22px;
      line-height: 1.35;
      font-weight: 500;
      letter-spacing: -.005em
    }

    .lead {
      color: var(--suave);
      font-size: 15.5px;
      margin-top: 14px
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ambar);
      margin-bottom: 14px;
      font-weight: 500
    }

    .contador {
      color: var(--tenue);
      font-weight: 400;
      letter-spacing: .08em
    }

    .lista {
      list-style: none;
      margin: 22px 0 4px;
      display: grid;
      gap: 12px
    }

    .lista li {
      display: flex;
      gap: 12px;
      color: var(--suave);
      font-size: 15px
    }

    .lista li::before {
      content: "";
      flex: none;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ambar);
      margin-top: 9px
    }

    .btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-weight: 500;
      font-size: 15.5px;
      border-radius: 99px;
      padding: 15px 28px;
      background: var(--ambar);
      color: var(--negro);
      transition: transform .15s var(--ease), opacity .2s, box-shadow .2s;
      margin-top: 30px;
      align-self: flex-start;
      box-shadow: 0 8px 28px -10px rgba(252, 163, 17, .55)
    }

    .btn:hover {
      transform: translateY(-1px)
    }

    .btn:active {
      transform: translateY(1px)
    }

    .btn:disabled {
      opacity: .32;
      cursor: not-allowed;
      box-shadow: none;
      transform: none
    }

    .btn-fantasma {
      background: transparent;
      color: var(--suave);
      box-shadow: none;
      padding: 15px 6px;
      margin-left: 10px
    }

    .botones {
      display: flex;
      align-items: center;
      flex-wrap: wrap
    }

    .enlace {
      color: var(--suave);
      text-decoration: underline;
      text-decoration-color: rgba(229, 229, 229, .3);
      text-underline-offset: 3px
    }

    .enlace:hover {
      color: var(--blanco)
    }

    .nota {
      font-size: 13px;
      color: var(--tenue);
      margin-top: 18px
    }

    .error {
      color: #FF9B8A;
      font-size: 14px;
      margin-top: 12px;
      min-height: 21px
    }

    .campo {
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .campo label {
      font-size: 13px;
      color: var(--suave)
    }

    .campo input {
      font: inherit;
      font-size: 22px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--blanco);
      background: var(--tarjeta);
      border: 1px solid var(--linea);
      border-radius: 14px;
      padding: 14px 18px;
      outline: none;
      width: 100%;
      max-width: 320px;
      transition: border-color .2s
    }

    .campo input:focus {
      border-color: var(--ambar)
    }

    /* --- Opciones --- */
    .opciones {
      display: grid;
      gap: 10px;
      margin-top: 26px
    }

    .op {
      appearance: none;
      font: inherit;
      text-align: left;
      color: var(--blanco);
      cursor: pointer;
      width: 100%;
      background: var(--tarjeta);
      border: 1px solid var(--linea);
      border-radius: var(--radio);
      padding: 15px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 15.5px;
      line-height: 1.4;
      transition: background .2s, border-color .2s, transform .15s var(--ease)
    }

    .op:hover {
      background: var(--tarjeta-hover);
      border-color: rgba(229, 229, 229, .22)
    }

    .op:active {
      transform: scale(.995)
    }

    .op .punto {
      flex: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--tenue);
      position: relative;
      transition: border-color .2s
    }

    .op.sel {
      border-color: var(--ambar);
      background: var(--ambar-velo)
    }

    .op.sel .punto {
      border-color: var(--ambar)
    }

    .op.sel .punto::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--ambar)
    }

    .op .tecla {
      margin-left: auto;
      font-size: 11px;
      color: var(--tenue);
      border: 1px solid var(--linea);
      border-radius: 6px;
      padding: 0 6px;
      display: none
    }

    @media (hover:hover) and (min-width:700px) {
      .op .tecla {
        display: inline-block
      }
    }

    .frecuencias {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 28px
    }

    .frecuencias .op {
      justify-content: center;
      text-align: center;
      padding: 18px 6px;
      font-size: 16px;
      font-weight: 500
    }

    @media (max-width:380px) {
      .frecuencias {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    .paso {
      display: flex;
      gap: 8px;
      margin-top: 22px;
      font-size: 13.5px;
      color: var(--tenue);
      flex-wrap: wrap
    }

    .paso span {
      padding: 6px 12px;
      border-radius: 99px;
      border: 1px solid var(--linea);
      transition: all .25s
    }

    .paso span.activo {
      color: var(--negro);
      background: var(--ambar);
      border-color: var(--ambar);
      font-weight: 500
    }

    .paso span.hecho {
      color: var(--suave);
      border-color: rgba(252, 163, 17, .45)
    }

    .tarjeta {
      border-radius: var(--radio);
      padding: 14px 16px 14px 18px;
      font-size: 15.5px;
      line-height: 1.4;
      cursor: pointer;
      background: var(--tarjeta);
      border: 1px solid var(--linea);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      font-family: inherit;
      color: var(--blanco);
      width: 100%;
      transition: background .2s, border-color .2s, opacity .2s
    }

    .tarjeta:hover {
      background: var(--tarjeta-hover)
    }

    .tarjeta .sello {
      flex: none;
      margin-left: auto;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      border-radius: 99px;
      padding: 3px 10px;
      align-self: center;
      opacity: 0;
      transition: opacity .2s
    }

    .tarjeta.mas {
      border-color: var(--ambar);
      background: var(--ambar-velo)
    }

    .tarjeta.mas .sello {
      opacity: 1;
      background: var(--ambar);
      color: var(--negro);
      font-weight: 600
    }

    .tarjeta.menos {
      border-color: rgba(229, 229, 229, .5)
    }

    .tarjeta.menos .sello {
      opacity: 1;
      border: 1px solid var(--suave);
      color: var(--suave)
    }

    .tarjeta.apagada {
      opacity: .55
    }

    .situacion {
      background: linear-gradient(180deg, rgba(19, 33, 60, .6), rgba(19, 33, 60, .28));
      border: 1px solid var(--linea);
      border-radius: var(--radio);
      padding: 18px 20px
    }

    .situacion .rotulo {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--tenue);
      margin-bottom: 8px
    }

    .situacion p {
      font-size: 18px;
      line-height: 1.45
    }

    .contexto,
    .situacion .contexto {
      font-size: 14px;
      color: var(--tenue);
      margin-bottom: 12px;
      line-height: 1.45
    }

    .complica {
      display: inline-block;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--negro);
      background: var(--ambar);
      border-radius: 99px;
      padding: 3px 10px;
      margin-bottom: 10px;
      font-weight: 600
    }

    .check {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-top: 22px;
      cursor: pointer;
      font-size: 14.5px;
      color: var(--suave)
    }

    .check input {
      flex: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 1.5px solid var(--tenue);
      margin-top: 1px;
      cursor: pointer;
      position: relative;
      transition: all .2s
    }

    .check input:checked {
      background: var(--ambar);
      border-color: var(--ambar)
    }

    .check input:checked::after {
      content: "";
      position: absolute;
      left: 7px;
      top: 3px;
      width: 5px;
      height: 10px;
      border: solid var(--negro);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg)
    }

    .resumen {
      display: grid;
      gap: 12px;
      margin-top: 20px
    }

    .resumen div {
      font-size: 14.5px;
      color: var(--suave);
      padding-left: 14px;
      border-left: 2px solid rgba(252, 163, 17, .5)
    }

    .resumen b {
      color: var(--blanco);
      font-weight: 500
    }

    .atras {
      appearance: none;
      background: none;
      border: 0;
      font: inherit;
      color: var(--tenue);
      font-size: 13.5px;
      cursor: pointer;
      margin-top: 22px;
      align-self: flex-start;
      padding: 6px 0;
      visibility: hidden
    }

    .atras.visible {
      visibility: visible
    }

    .atras:hover {
      color: var(--blanco)
    }

    .cargando {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(252, 163, 17, .25);
      border-top-color: var(--ambar);
      animation: gira .8s linear infinite;
      vertical-align: -3px;
      margin-right: 10px
    }

    @keyframes gira {
      to {
        transform: rotate(360deg)
      }
    }

    .aviso {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      background: var(--azul);
      border: 1px solid var(--linea);
      color: var(--blanco);
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 13.5px;
      opacity: 0;
      transition: all .35s var(--ease);
      pointer-events: none;
      z-index: 5
    }

    .aviso.visible {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    footer {
      padding: 18px 0 26px;
      font-size: 12px;
      color: var(--tenue);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap
    }

    footer a {
      color: var(--tenue)
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    @media (min-width:700px) {
      h1 {
        font-size: 36px
      }

      h2 {
        font-size: 24px
      }

      main {
        padding-top: 40px
      }
    }
  </style>
</head>

s.", "escala": [], "items": [{ "id": "e01", "situacion": "Tienes que explicarle a tu equipo un cambio en la forma de trabajar. Te dan 10 minutos en la junta de la mañana.", "complica": "A la mitad, un compañero con mucha antigüedad dice frente a todos: \"esto ya lo intentamos y no funcionó\".", "t1": [{ "id": "e01t1a", "texto": "Lo explicas con un ejemplo real de la semana pasada y pides que alguien lo repita con sus palabras." }, { "id": "e01t1b", "texto": "Explicas lo básico y que cada quien lo vaya agarrando en el camino." }, { "id": "e01t1c", "texto": "Explicas los pasos uno por uno, con calma, para que nadie se pierda." }, { "id": "e01t1d", "texto": "Mandas el proceso por escrito antes y en la junta solo resuelves dudas." }], "t2": [{ "id": "e01t2a", "texto": "Le pides que cuente qué pasó esa vez y lo usas para mostrar qué cambia ahora." }, { "id": "e01t2b", "texto": "Le dices que lo platican después para no quitarle tiempo a la junta." }, { "id": "e01t2c", "texto": "Le explicas con datos por qué esta vez es diferente." }, { "id": "e01t2d", "texto": "Sigues con la explicación; el cambio ya está decidido." }] }] }, { "id": "b4", "nombre": "Lo que he hecho", "tipo": "frecuencia", "instruccion": "Ahora piensa en los últimos 3 meses. Cuenta solo las veces que puedas recordar con un ejemplo concreto; si no te viene ninguna a la mente, marca cero.", "escala": ["0", "1–2", "3–5", "6 o más"], "items": [{ "id": "h01", "texto": "¿Cuántas veces explicaste algo frente a un grupo (junta, capacitación, presentación)?" }, { "id": "h09", "texto": "¿Cuántas veces entregaste algo después de la fecha acordada?" }] }, { "id": "b5", "nombre": "Cómo aprendo y qué busco", "tipo": "likert", "instruccion": "Ya casi. Estas frases son sobre cómo aprendes y hacia dónde vas. Contesta pensando en ti hoy.", "escala": ["Nada como yo", "Poco como yo", "Más o menos", "Bastante como yo", "Totalmente como yo"], "items": [{ "id": "k01", "texto": "Cuando aprendo algo nuevo, busco aplicarlo esa misma semana." }, { "id": "k03", "texto": "Me gusta que me pongan en situaciones donde no sé qué hacer." }, { "id": "k11", "texto": "Esta es para confirmar que sigues con nosotros: elige \"Nada como yo\"." }] }] };

    // 11 articulaciones: cabeza, cuello, cadera, rodillaA, pieA, rodillaB, pieB, codoA, manoA, codoB, manoB (piso en y=98)
    const POSES = [
      [[7, 63], [0, 66], [-8, 92], [8, 70], [12, 97], [6, 72], [9, 97], [4, 80], [11, 76], [2, 82], [9, 78]],          // sentada, encogida
      [[-4, 54], [-6, 63], [-8, 92], [6, 76], [16, 97], [4, 78], [13, 97], [0, 75], [9, 76], [-12, 77], [-16, 94]],     // sentada, erguida
      [[2, 33], [0, 42], [-4, 68], [12, 72], [13, 97], [-6, 96], [-22, 97], [6, 55], [12, 68], [-4, 57], [-2, 70]],     // una rodilla en el piso
      [[11, 33], [6, 40], [-6, 64], [12, 74], [8, 98], [9, 76], [3, 98], [12, 53], [13, 69], [9, 55], [10, 71]],        // levantándose
      [[0, 9.5], [0, 18], [0, 48], [2, 73], [2, 98], [-2, 73], [-2, 98], [4, 33], [5, 47], [-4, 33], [-5, 47]],         // de pie
      [[4.5, 9.5], [3, 18], [1, 48], [8, 72], [12, 98], [-3, 73], [-9, 97], [-2, 33], [-7, 45], [8, 32], [13, 43]],    // dando un paso
      [[7, 8.5], [5, 17], [2, 47], [13, 70], [20, 97], [-5, 72], [-15, 95], [-3, 31], [-9, 42], [13, 30], [19, 38]]    // caminando firme
    ];
    const W = 360, M = 22, PISO = 72, ESC = 0.62;
    let vistaV = 0, metaV = 0, animando = false;
    function lerp(a, b, t) { return a + (b - a) * t; }
    function poseEn(v) {
      const i = Math.max(0, Math.min(5, Math.floor(v))), t = Math.max(0, Math.min(1, v - i));
      const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      return POSES[i].map((p, k) => [lerp(p[0], POSES[i + 1][k][0], e), lerp(p[1], POSES[i + 1][k][1], e)]);
    }
    function xEn(v) {
      if (!CONTEOS.length) return M;
      const fr = v <= 5 ? fraccionGlobal(v) * .9 : .9 + .1 * (v - 5);
      return M + fr * (W - 2 * M - 20);
    }
    function trazo(P, x, color, opac, ancho) {
      const T = (p) => `${(x + p[0] * ESC).toFixed(1)},${(PISO - (98 - p[1]) * ESC).toFixed(1)}`;
      const [cab, cue, cad, rA, pA, rB, pB, cA, mA, cB, mB] = P;
      const hombro = [lerp(cue[0], cad[0], .1), lerp(cue[1], cad[1], .1)];
      const linea = (pts, o) => `<polyline points="${pts.map(T).join(' ')}" fill="none" stroke="${color}" stroke-opacity="${o}" stroke-width="${ancho}" stroke-linecap="round" stroke-linejoin="round"/>`;
      return linea([hombro, cB, mB], opac * .6) + linea([cad, rB, pB], opac * .6) +
        linea([cue, cad], opac) + linea([cad, rA, pA], opac) + linea([hombro, cA, mA], opac) +
        `<circle cx="${(x + cab[0] * ESC).toFixed(1)}" cy="${(PISO - (98 - cab[1]) * ESC).toFixed(1)}" r="4.3" fill="none" stroke="${color}" stroke-opacity="${opac}" stroke-width="${ancho}"/>`;
    }
    function dibujar() {
      const x = xEn(vistaV);
      let s = `<line x1="${M}" y1="${PISO + 1.5}" x2="${W - M}" y2="${PISO + 1.5}" stroke="#E5E5E5" stroke-opacity=".1" stroke-width="1" stroke-dasharray="2 4"/>`;
      s += `<line x1="${M}" y1="${PISO + 1.5}" x2="${x.toFixed(1)}" y2="${PISO + 1.5}" stroke="#FCA311" stroke-opacity=".55" stroke-width="1.2"/>`;
      for (let k = 0; k <= 6; k++) if (k <= vistaV - .35) s += trazo(POSES[k], xEn(k), '#FDFDFD', .2, 1.7);
      s += `<g class="figura-actual">${trazo(poseEn(vistaV), x, '#FCA311', 1, 2.3)}</g>`;
      $('#lienzo').innerHTML = s;
    }
    function moverFigura(v, inmediato) {
      metaV = v;
      if (inmediato || matchMedia('(prefers-reduced-motion: reduce)').matches) { vistaV = v; dibujar(); return; }
      if (animando) return;
      animando = true;
      const paso = () => {
        const d = metaV - vistaV;
        if (Math.abs(d) < .002) { vistaV = metaV; dibujar(); animando = false; return; }
        vistaV += d * .085; dibujar(); requestAnimationFrame(paso);
      };
      requestAnimationFrame(paso);
    }

    /* ===================== Pantallas ===================== */
    let CONTEOS = [], TOTAL = 1;
    function construirPantallas() {
      pantallas = [];
      S.banco.bloques.forEach((b, bi) => {
        pantallas.push({ t: 'intro', b, bi });
        b.items.forEach((it) => {
          if (b.tipo === 'escenario') {
            pantallas.push({ t: 'q', b, bi, it, k: it.id + 't1', tiempo: 't1' });
            pantallas.push({ t: 'q', b, bi, it, k: it.id + 't2', tiempo: 't2' });
          } else pantallas.push({ t: 'q', b, bi, it, k: it.id });
        });
      });
      CONTEOS = S.banco.bloques.map((b, i) => pantallas.filter((p) => p.t === 'q' && p.bi === i).length);
      TOTAL = CONTEOS.reduce((a, x) => a + x, 0) || 1;
    }
    const preguntas = () => pantallas.filter((p) => p.t === 'q');
    function fraccionGlobal(v) {
      const n = CONTEOS.length || 1, b = Math.min(n - 1, Math.floor(v)), f = v - b;
      let antes = 0;
      for (let i = 0; i < b; i++) antes += CONTEOS[i];
      return Math.min(1, (antes + f * (CONTEOS[b] || 0)) / TOTAL);
    }
    function contestada(p) {
      const v = S.R[p.k];
      if (p.b.tipo === 'eleccion' || p.b.tipo === 'escenario') return v && v.mas && v.menos;
      return v !== undefined && v !== null;
    }
    function actualizarAvance() {
      const p = pantallas[S.idx];
      const bi = p.bi, enB = pantallas.filter((x) => x.t === 'q' && x.bi === bi);
      const hechas = enB.filter(contestada).length;
      const total = preguntas().length, totalHechas = preguntas().filter(contestada).length;
      $('#avanceTexto').textContent = `Parte ${bi + 1} de ${S.banco.bloques.length} · ${p.b.nombre}`;
      $('#avancePct').textContent = Math.round(totalHechas / total * 100) + '%';
      $('#avance').classList.add('visible');
      moverFigura(bi + (enB.length ? hechas / enB.length : 0));
    }

    function tic() {
      const ahora = Date.now();
      if (S && ultimoTic && !document.hidden) {
        const p = pantallas[S.idx];
        if (p && p.t === 'q') S.tiempos[p.b.id] = (S.tiempos[p.b.id] || 0) + Math.min(300, (ahora - ultimoTic) / 1000);
      }
      ultimoTic = ahora;
    }
    document.addEventListener('visibilitychange', () => { if (document.hidden) { tic(); guardar(); ultimoTic = null; } else ultimoTic = Date.now(); });

    function montar(html, alMontar) {
      const esc0 = $('#escenario');
      const viejo = esc0.firstElementChild;
      const poner = () => {
        esc0.innerHTML = `<section class="pantalla">${html}</section>`;
        const n = esc0.firstElementChild;
        requestAnimationFrame(() => requestAnimationFrame(() => n.classList.add('entra')));
        alMontar && alMontar(n);
        const foco = n.querySelector('[data-foco]'); if (foco) setTimeout(() => foco.focus({ preventScroll: true }), 60);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      if (viejo) { viejo.classList.remove('entra'); viejo.classList.add('sale'); setTimeout(poner, 200); } else poner();
    }

    function ir(idx) {
      tic();
      S.idx = Math.max(0, Math.min(pantallas.length - 1, idx));
      guardar();
      ocupado = false;
      const p = pantallas[S.idx];
      actualizarAvance();
      if (p.t === 'intro') return pantallaIntro(p);
      pantallaPregunta(p);
    }
    function siguiente() {
      if (S.idx >= pantallas.length - 1) return enviar();
      ir(S.idx + 1);
    }

    function pantallaIntro(p) {
      const n = p.b.items.length * (p.b.tipo === 'escenario' ? 2 : 1);
      const que = { likert: 'frases', eleccion: 'grupos de frases', escenario: 'respuestas', frecuencia: 'preguntas' }[p.b.tipo] || 'preguntas';
      montar(`
    <p class="eyebrow">Parte ${p.bi + 1} de ${S.banco.bloques.length}</p>
    <h1>${esc(p.b.nombre)}</h1>
    <p class="lead">${esc(p.b.instruccion)}</p>
    <p class="nota">${p.b.tipo === 'escenario' ? p.b.items.length + ' situaciones · ' : ''}${n} ${que} · unos ${MINUTOS[p.b.id] || 5} minutos</p>
    <button class="btn" data-foco id="empezar">${p.bi === 0 ? 'Empezar' : 'Seguir'}</button>`,
        (n0) => n0.querySelector('#empezar').onclick = () => siguiente());
    }

    function botonAtras(p) {
      const prev = pantallas[S.idx - 1];
      const puede = prev && prev.t === 'q' && prev.bi === p.bi;
      return `<button class="atras ${puede ? 'visible' : ''}" id="atras">← Anterior</button>`;
    }
    function encabezado(p) {
      const enB = pantallas.filter((x) => x.t === 'q' && x.bi === p.bi);
      const pos = enB.indexOf(p) + 1;
      return `<p class="eyebrow">${esc(p.b.nombre)} <span class="contador">· ${pos}/${enB.length}</span></p>`;
    }

    function pantallaPregunta(p) {
      const tipo = p.b.tipo;
      if (tipo === 'likert' || tipo === 'frecuencia') return pantallaEscala(p);
      return pantallaDoble(p);
    }

    function pantallaEscala(p) {
      const frec = p.b.tipo === 'frecuencia';
      const val = S.R[p.k];
      const ops = p.b.escala.map((et, i) => {
        const v = frec ? i : i + 1;
        return `<button class="op ${val === v ? 'sel' : ''}" data-v="${v}">${frec ? '' : '<span class="punto"></span>'}<span>${esc(et)}</span>${frec ? '' : `<span class="tecla">${i + 1}</span>`}</button>`;
      }).join('');
      montar(`${encabezado(p)}
    ${frec ? '<p class="contexto">En los últimos 3 meses…</p>' : ''}
    <h2>${esc(p.it.texto)}</h2>
    <div class="${frec ? 'frecuencias' : 'opciones'}">${ops}</div>
    ${botonAtras(p)}`, (n) => {
        n.querySelectorAll('.op').forEach((b) => b.onclick = () => elegirEscala(p, Number(b.dataset.v), n));
        n.querySelector('#atras').onclick = () => ir(S.idx - 1);
      });
    }
    function elegirEscala(p, v, n) {
      if (ocupado) return;
      ocupado = true;
      tic();
      S.R[p.k] = v; guardar();
      n.querySelectorAll('.op').forEach((b) => b.classList.toggle('sel', Number(b.dataset.v) === v));
      actualizarAvance();
      setTimeout(siguiente, 380);
    }

    function pantallaDoble(p) {
      const esEsc = p.b.tipo === 'escenario';
      const crudas = esEsc ? p.it[p.tiempo] : p.it.frases;
      const ops = barajar(crudas, S.codigo + p.k);
      const et = esEsc ? ['Lo más probable', 'Lo menos probable'] : ['Más como yo', 'Menos como yo'];
      let cabeza = '';
      if (esEsc && p.tiempo === 't1') {
        cabeza = `<div class="situacion"><p class="rotulo">La situación</p><p>${esc(p.it.situacion)}</p></div>`;
      } else if (esEsc) {
        cabeza = `<div class="situacion"><p class="contexto">${esc(p.it.situacion)}</p><span class="complica">Se complica</span><p>${esc(p.it.complica)}</p></div>`;
      }
      montar(`${encabezado(p)}
    ${cabeza}
    ${!esEsc ? '<h2>¿Cuál se parece más a ti y cuál menos?</h2>' : ''}
    <div class="paso" id="paso"><span>1 · ${et[0]}</span><span>2 · ${et[1]}</span></div>
    <div class="opciones">${ops.map((o) => `<button class="tarjeta" data-id="${esc(o.id)}"><span>${esc(o.texto)}</span><span class="sello"></span></button>`).join('')}</div>
    ${botonAtras(p)}`, (n) => {
        const pintar = () => {
          const a = S.R[p.k] || {};
          n.querySelectorAll('.tarjeta').forEach((t) => {
            const id = t.dataset.id;
            t.classList.toggle('mas', a.mas === id);
            t.classList.toggle('menos', a.menos === id);
            t.classList.toggle('apagada', !!(a.mas && a.menos) && a.mas !== id && a.menos !== id);
            t.querySelector('.sello').textContent = a.mas === id ? (esEsc ? 'Más' : 'Más') : a.menos === id ? 'Menos' : '';
          });
          const s = n.querySelectorAll('#paso span');
          s[0].className = a.mas ? 'hecho' : 'activo';
          s[1].className = a.menos ? 'hecho' : a.mas ? 'activo' : '';
        };
        pintar();
        n.querySelectorAll('.tarjeta').forEach((t) => t.onclick = () => {
          if (ocupado) return;
          const id = t.dataset.id;
          const a = Object.assign({}, S.R[p.k] || {});
          if (a.mas === id) delete a.mas;
          else if (a.menos === id) delete a.menos;
          else if (!a.mas) a.mas = id;
          else if (!a.menos) a.menos = id;
          else { a.menos = id; }
          tic();
          S.R[p.k] = a; guardar(); pintar(); actualizarAvance();
          if (a.mas && a.menos) { ocupado = true; setTimeout(siguiente, 560); }
        });
        n.querySelector('#atras').onclick = () => ir(S.idx - 1);
      });
    }

    document.addEventListener('keydown', (e) => {
      if (!S || !pantallas.length || e.metaKey || e.ctrlKey || e.altKey) return;
      const p = pantallas[S.idx];
      if (!p || p.t !== 'q') return;
      const n = Number(e.key);
      if (p.b.tipo === 'likert' && n >= 1 && n <= 5) { const b = document.querySelector(`.op[data-v="${n}"]`); b && b.click(); }
      if (p.b.tipo === 'frecuencia' && n >= 1 && n <= 4) { const b = document.querySelector(`.op[data-v="${n - 1}"]`); b && b.click(); }
    });

    /* ===================== Acceso, bienvenida y consentimiento ===================== */
    function pantallaAcceso(codigoInicial, mensaje) {
      $('#avance').classList.remove('visible');
      montar(`
    <p class="eyebrow">Evaluación de competencias</p>
    <h1>Conoce en qué eres fuerte hoy y hacia dónde puedes crecer.</h1>
    <form id="formAcceso" class="campo" autocomplete="off">
      <label for="codigo">Escribe el código que te compartieron</label>
      <input id="codigo" name="codigo" inputmode="text" maxlength="9" placeholder="XXXX-XXXX" value="${esc(codigoInicial || '')}" data-foco>
      <p class="error" id="error">${esc(mensaje || '')}</p>
      <div class="botones"><button class="btn" id="entrar" type="submit" style="margin-top:6px">Entrar</button></div>
    </form>
    <p class="nota">¿No tienes código? Pídelo a la persona que te invitó a esta evaluación.${DEMO ? ' <br>Modo demostración: usa el código <b style="color:var(--ambar)">DEMO</b>.' : ''}</p>`, (n) => {
        const inp = n.querySelector('#codigo');
        inp.addEventListener('input', () => {
          let v = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
          if (v.length > 4 && v !== 'DEMO') v = v.slice(0, 4) + '-' + v.slice(4);
          inp.value = v;
        });
        n.querySelector('#formAcceso').onsubmit = (e) => { e.preventDefault(); entrar(inp.value); };
      });
    }

    async function entrar(codigoCrudo) {
      const codigo = String(codigoCrudo || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^(.{4})(.{4})$/, '$1-$2');
      const err = $('#error'), btn = $('#entrar');
      if (!codigo) { if (err) err.textContent = 'Escribe tu código.'; return; }
      if (btn) { btn.disabled = true; btn.innerHTML = '<span class="cargando"></span>Entrando'; }
      try {
        let r;
        if (DEMO) {
          r = codigo === 'DEMO' ? { ok: true, nombre: 'Orlando', banco: BANCO_DEMO } : { ok: false, motivo: 'invalido' };
          await new Promise((ok) => setTimeout(ok, 500));
        } else {
          const resp = await fetch(API_URL + '?accion=iniciar&codigo=' + encodeURIComponent(codigo));
          r = await resp.json();
        }
        if (!r.ok) {
          const m = { invalido: 'Ese código no existe. Revisa que esté bien escrito.', completado: 'Este código ya se usó. Si crees que es un error, escribe a orlando@arewamx.com.' }[r.motivo] || 'Algo falló de nuestro lado. Intenta de nuevo en unos minutos.';
          return pantallaAcceso(codigo, m);
        }
        const previo = leer(codigo);
        S = { codigo, nombre: r.nombre, banco: r.banco, R: {}, idx: 0, tiempos: {}, inicio: new Date().toISOString(), consentimiento: null };
        if (previo && previo.consentimiento) {
          Object.assign(S, { R: previo.R || {}, tiempos: previo.tiempos || {}, inicio: previo.inicio, consentimiento: previo.consentimiento });
        }
        construirPantallas();
        if (S.consentimiento) {
          const pend = pantallas.findIndex((p) => p.t === 'q' && !contestada(p));
          if (pend < 0) { S.idx = pantallas.length - 1; return enviar(); }
          const intro = pantallas.findIndex((p) => p.t === 'intro' && p.bi === pantallas[pend].bi);
          const primeraDelBloque = pantallas.findIndex((p) => p.t === 'q' && p.bi === pantallas[pend].bi);
          aviso('Seguimos donde te quedaste');
          return ir(pend === primeraDelBloque ? intro : pend);
        }
        guardar();
        pantallaBienvenida();
      } catch (e) {
        pantallaAcceso(codigo, 'No pudimos conectar. Revisa tu internet e intenta de nuevo.');
      }
    }

    function pantallaBienvenida() {
      montar(`
    <p class="eyebrow">Bienvenida</p>
    <h1>Hola, ${esc(S.nombre)}.</h1>
    <p class="lead">Vas a encontrar frases, situaciones de trabajo y algunas preguntas sobre lo que has hecho. No es un examen: no hay respuestas buenas ni malas. Lo único que sirve es que contestes como eres hoy.</p>
    <ul class="lista">
      <li>Son unos 35 minutos, en 5 partes.</li>

      <li>Busca un lugar tranquilo y contesta sin ayuda.</li>

    </ul>
    <button class="btn" data-foco id="seguir">Continuar</button>`, (n) => n.querySelector('#seguir').onclick = pantallaConsentimiento);
    }

    function pantallaConsentimiento() {
      montar(`
    <p class="eyebrow">Antes de empezar</p>
    <h2>Tus datos y tus resultados</h2>
    <div class="resumen">
      <div><b>Quién los cuida.</b> Arewá de México es responsable de tus datos personales.</div>

    <div class="botones"><button class="btn" id="comenzar" disabled>Acepto y empiezo</button><button class="btn btn-fantasma" id="noacepto">No acepto</button></div>`, (n) => {
        const c = n.querySelector('#acepto'), b = n.querySelector('#comenzar');
        c.onchange = () => b.disabled = !c.checked;
        b.onclick = () => { S.consentimiento = { aceptado: true, fecha: new Date().toISOString(), version: AVISO_VERSION }; guardar(); ir(0); };
        n.querySelector('#noacepto').onclick = () => montar(`
      <p class="eyebrow">Está bien</p><h2>Sin tu consentimiento no podemos aplicar la evaluación.</h2>
      <p class="lead">No se guardó ninguna respuesta. Si cambias de opinión, vuelve a abrir tu enlace.</p>

      });

    /* ===================== Envío y cierre ===================== */
    async function enviar() {
      tic();
      guardar();
      moverFigura(5);
      montar(`<p class="eyebrow">Último paso</p><h2><span class="cargando"></span>Enviando tus respuestas…</h2><p class="lead">No cierres esta página.</p>`);
      const payload = {
        codigo: S.codigo, version: S.banco.version, inicio: S.inicio, fin: new Date().toISOString(),
        tiempos: Object.fromEntries(Object.entries(S.tiempos).map(([k, v]) => [k, Math.round(v)])),
        consentimiento: S.consentimiento, respuestas: S.R
      };
      try {
        let r;
        if (DEMO) { window.__evaPayload = payload; await new Promise((ok) => setTimeout(ok, 900)); r = { ok: true }; }
        else { const resp = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) }); r = await resp.json(); }
        if (!r.ok) throw new Error(r.motivo || 'error');
        const nombre = S.nombre;
        borrar(S.codigo);
        pantallaGracias(nombre);
      } catch (e) {
        montar(`<p class="eyebrow">Sin conexión</p><h2>No se pudieron enviar tus respuestas.</h2>
      <p class="lead">No te preocupes: siguen guardadas en este dispositivo. Revisa tu internet e intenta otra vez.</p>
      <button class="btn" id="reintentar" data-foco>Reintentar</button>`, (n) => n.querySelector('#reintentar').onclick = enviar);
      }
    }

    function pantallaGracias(nombre) {
      $('#avancePct').textContent = '100%';
      $('#avanceTexto').textContent = 'Completado';
      moverFigura(6);
      montar(`
    <p class="eyebrow">Completado</p>
